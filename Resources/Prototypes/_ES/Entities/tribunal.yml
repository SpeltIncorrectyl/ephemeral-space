- type: entity
  id: Tribunal
  name: tribunal
  description: An employee tribunal to resolve the bloodshed.
  components:
  - type: Sprite
    sprite: _ES/Structures/Specific/tribunal.rsi
    state: icon
    scale: "5,5"
  - type: Physics
    canCollide: true
  - type: ForceProjectileCollision
  - type: Reflect
    reflectProb: 1
    showPopup: false
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeAabb
          bounds: "-2.5,-2.5,2.5,2.5"
        density: 15
        hard: false
        mask:
        - MobMask
        layer:
        - BulletImpassable
        - Opaque
  - type: StatusEffectOnFixture
    fixture: fix1
    effects:
    - StatusEffectPacified
    whitelist:
      components:
      - Body
