- type: entity
  name: handgun
  parent: BaseItem
  id: NGBasePistol
  description: A simple 9mm handgun.
  abstract: true
  components:
  - type: Sprite
    sprite: _ES/Objects/Weapons/Guns/9mm.rsi
    layers:
    - state: base
      map: ["enum.GunVisualLayers.Base"]
    - state: mag-0
      map: ["enum.GunVisualLayers.Mag"]
  - type: Item
    size: Small
    shape:
    - 0,0,1,0
    - 0,1,0,1
    storedOffset: 0,-4
  - type: Tag
    tags:
    - Sidearm
  - type: Clothing
    sprite: Objects/Weapons/Guns/Pistols/viper.rsi
    quickEquip: false
    slots:
    - Belt
  - type: Appearance
  - type: ESCrosshairProvider
  - type: NGGun
    firerate: 3.5
  - type: NGProjectileShooter
  - type: NGInnateProjectileSource
    proto: NGBullet

- type: entity
  name: semi-auto handgun
  parent: NGBasePistol
  id: NGSemiAutoPistol
  components:
  - type: NGGun
    semiAutomatic: true

- type: entity
  name: automatic handgun
  parent: NGBasePistol
  id: NGAutoPistol
  components:
  - type: NGGun
    semiAutomatic: false